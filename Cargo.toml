[workspace]
members = ["crates/mcp-relay"]
resolver = "2"

# Workspace 全 member の共通 lint 設定。
# rust-alc-api と同様 unexpected_cfgs を allow して `cfg(coverage)` を黙らせる。
[workspace.lints.rust]
unexpected_cfgs = { level = "allow", check-cfg = ['cfg(coverage)'] }

# Release profile は member 個別の `Cargo.toml` で `[profile.release]` を書いても
# `[workspace]` Cargo.toml の同 section が優先される (Cargo 仕様)。binary 追加 (#9
# Phase 2/3) 時に opt-level=3 / strip=true / lto=thin を入れる前提で空欄のまま。
