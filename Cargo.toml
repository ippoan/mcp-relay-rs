[workspace]
members = ["crates/mcp-relay", "binaries/github-mcp-server-rs"]
resolver = "2"

# Workspace 全 member の共通 lint 設定。
# rust-alc-api と同様 unexpected_cfgs を allow して `cfg(coverage)` を黙らせる。
[workspace.lints.rust]
unexpected_cfgs = { level = "allow", check-cfg = ['cfg(coverage)'] }

# Phase 2 (#9) で binary 吸収につき release profile を有効化。旧
# ippoan/github-mcp-server-rs/Cargo.toml の同設定を移植 — release tag の sha256
# 互換性を保つため変更しないこと。
[profile.release]
opt-level = 3
lto = "thin"
strip = true
