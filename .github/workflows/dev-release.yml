name: Dev Release

# main 上の lib 変更を自動で `dev-N` tag 採番 + push + GitHub Release 作成
# (--prerelease) を 1-workflow で完結させる。
#
# `ippoan/ci-workflows/dev-tag-release.yml` の Mode B (create_release: true) を
# 使うので TAG_RELEASE_PAT は不要 (GITHUB_TOKEN だけで push + release 作成可能)。
# 本 repo は lib crate なので binary build / asset attach も無い。
#
# 旧 design: tag push → release.yml (`on: push: tags: ["dev-*"]`) を別 workflow
# 発火させる 2-step chain は、tag push を GITHUB_TOKEN でやると他 workflow が
# trigger されない GitHub Actions の制約があり TAG_RELEASE_PAT が必須だった。
# create_release: true で内部完結させることでこの制約から脱却している。
#
# branch ref 注: ci-workflows#19 が main merge されたら `@main` に戻す。

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'Cargo.toml'
      - '.github/workflows/dev-release.yml'

permissions:
  contents: write

jobs:
  dev-release:
    uses: ippoan/ci-workflows/.github/workflows/dev-tag-release.yml@feat/inline-release-in-tag-reusables
    with:
      create_release: true
    permissions:
      contents: write
