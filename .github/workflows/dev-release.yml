name: Dev Release

# main 上の binary 含む変更を自動で `dev-N` tag 採番 + push する。tag push 後に
# `release.yml` (`on: push: tags: ["dev-*"]`) が連鎖発火して、per-binary tarball を
# build + GitHub Release を作成 + asset を attach する。
#
# Mode A (`create_release: false`) を使用 — issue #9 Phase 2.B で binary release を
# 動かすため、release.yml チェーンが必要。GITHUB_TOKEN-pushed tag は他 workflow を
# trigger しない GitHub Actions 制約があるため `TAG_RELEASE_PAT` で push する必要がある。
# (Phase 1 までは lib-only で `create_release: true` Mode B を使っていたが、binary が
# 入った Phase 2 以降は release.yml で multi-asset attach する Mode A に戻す。)

on:
  push:
    branches: [main]
    paths:
      # Issue #9 Phase 1: sources are now under crates/<member>/src/**.
      # Also re-trigger when Cargo.lock changes (dep bumps that affect
      # binary build reproducibility, now tracked) or when any Bazel
      # config moves (rules_rust version, crate.from_cargo manifests).
      - 'crates/**'
      - 'binaries/**'        # Phase 2/3 で binary 吸収後の予約
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'MODULE.bazel'
      - '.github/workflows/dev-release.yml'

permissions:
  contents: write

jobs:
  dev-release:
    uses: ippoan/ci-workflows/.github/workflows/dev-tag-release.yml@main
    with:
      create_release: false   # Mode A — tag push only, release.yml が後段で release 作成
    permissions:
      contents: write
    secrets:
      TAG_RELEASE_PAT: ${{ secrets.TAG_RELEASE_PAT }}
