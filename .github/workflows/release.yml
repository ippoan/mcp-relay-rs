name: Release

# Lib crate なので binary build / asset attach は無く、tag push に対して
# GitHub Release object を作るだけの軽量 workflow。
#
# 起動契機:
#   - `v*` tag push (tag-release.yml で workflow_dispatch から手動採番) → stable release
#   - `dev-*` tag push (dev-release.yml で main 自動採番) → prerelease
#
# `-` を含む tag (`v0.0.1-rc1` / `dev-12` 等) は自動で prerelease 扱い (`releases/latest`
# に出ないので consumer の stable channel は影響を受けない、binary repo 群と同じ慣習)。
# Release body は GitHub の `--generate-notes` で commit log + PR 一覧を自動生成。

on:
  push:
    tags: ["v*", "dev-*"]

permissions:
  contents: write

jobs:
  test:
    name: cargo test (release gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: mcp-relay-rs

      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --all-targets --all-features --no-fail-fast

  release:
    name: GitHub Release
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          # `-` 含む tag は prerelease。binary repo 群 (rust-binary-release.yml 内) と同じ判定。
          if [[ "$TAG" == *-* ]]; then
            PRERELEASE_FLAG=--prerelease
          else
            PRERELEASE_FLAG=--latest
          fi
          gh release create "$TAG" \
            --title "$TAG" \
            --generate-notes \
            $PRERELEASE_FLAG
