name: CI

on:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# `push: main` trigger は意図的に外している。PR の auto-merge gate (lib-ci +
# coverage + bazel-build が green でないと merge できない) で main 品質を保つ
# 前提なので、main push 後に同じ test を再走させるのは無駄。main push 起点で
# 走るのは dev-release.yml だけ。

permissions:
  contents: write
  pull-requests: write

jobs:
  # cargo workspace 全体の fmt + clippy + test。issue #9 Phase 1 で workspace 化
  # したので `--workspace` を付ける。binary 追加 (Phase 2/3) 時もそのまま拡張。
  lib-ci:
    name: lib CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install stable Rust + components
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: mcp-relay-rs

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: cargo test
        run: cargo test --workspace --all-targets --all-features --no-fail-fast

  # 100% line coverage gate on files registered in coverage_100.toml.
  # Issue #9 Phase 1 で path が `crates/mcp-relay/src/...` に shift したので
  # scripts/coverage_gate.sh も `--workspace` 経由に更新済み。
  coverage:
    name: coverage
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: mcp-relay-rs-coverage

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov

      - name: cargo llvm-cov + 100% gate
        run: bash scripts/coverage_gate.sh

  # Bazel build (issue #9 Phase 1) — rust-alc-api と同じ `ippoan/setup-bazel@main`
  # action で disk-cache + external-cache + repository-cache を有効化。matrix は
  # Phase 2/3 で binary を吸収した時に `//binaries/<name>` を加えて split build に拡張。
  bazel-build:
    name: bazel build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: mcp-relay-lib
            targets: "//crates/mcp-relay:mcp-relay //crates/mcp-relay:mcp-relay_test"
    steps:
      - uses: actions/checkout@v4

      - uses: ippoan/setup-bazel@main
        with:
          disk-cache: "bazel-${{ matrix.name }}"
          external-cache: true
          repository-cache: true

      - name: Build (Bazel)
        run: bazel build -c fastbuild --strip=always ${{ matrix.targets }}

  auto-merge:
    name: Auto Merge
    needs: [lib-ci, coverage, bazel-build]
    if: >-
      always() &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.draft == false &&
      needs.lib-ci.result == 'success' &&
      needs.coverage.result == 'success' &&
      needs.bazel-build.result == 'success'
    uses: ippoan/ci-workflows/.github/workflows/auto-merge.yml@main
    permissions:
      contents: write
      pull-requests: write
    secrets:
      # TAG_RELEASE_PAT を auto-merge にも渡すことで、merge commit が PAT 作者で
      # push される → post-merge workflow (dev-release.yml 等) が GitHub Actions
      # の "GITHUB_TOKEN events don't trigger workflows" 制約を回避して発火する。
      AUTO_MERGE_PAT: ${{ secrets.TAG_RELEASE_PAT }}
