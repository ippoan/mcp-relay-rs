name: CI

on:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# `push: main` trigger は意図的に外している。PR の auto-merge gate (lib-ci +
# coverage が green でないと merge できない) で main 品質を保つ前提なので、
# main push 後に同じ lib-ci + coverage を再走させるのは無駄。main push 起点で
# 走るのは dev-release.yml だけ。

permissions:
  contents: write
  pull-requests: write

jobs:
  # rust-ci.yml は binary 想定 (binary_name 必須 + --help smoke test) なので
  # lib-only の本 crate ではここに直接 fmt / clippy / test を書く。
  lib-ci:
    name: lib CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install stable Rust + components
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: mcp-relay-rs

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: cargo test
        run: cargo test --all-targets --all-features --no-fail-fast

  # 100% line coverage gate on files registered in coverage_100.toml.
  # Convention copied from ippoan/cc-relay (scripts/coverage_gate.sh +
  # scripts/coverage_allowlist.txt + coverage_100.toml).
  coverage:
    name: coverage
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: mcp-relay-rs-coverage
          # ci.yml は PR でしか走らないので main 限定 save 制約は外す。
          # base branch (main 由来 PR) で save される。

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov

      - name: cargo llvm-cov + 100% gate
        run: bash scripts/coverage_gate.sh

  auto-merge:
    name: Auto Merge
    needs: [lib-ci, coverage]
    if: >-
      always() &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.draft == false &&
      needs.lib-ci.result == 'success' &&
      needs.coverage.result == 'success'
    uses: ippoan/ci-workflows/.github/workflows/auto-merge.yml@main
    permissions:
      contents: write
      pull-requests: write
    secrets:
      # TAG_RELEASE_PAT を auto-merge にも渡すことで、merge commit が PAT 作者で
      # push される → post-merge workflow (dev-release.yml 等) が GitHub Actions
      # の "GITHUB_TOKEN events don't trigger workflows" 制約を回避して発火する。
      AUTO_MERGE_PAT: ${{ secrets.TAG_RELEASE_PAT }}
