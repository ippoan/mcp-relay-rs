name: ci

on:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# `push: main` trigger は意図的に外している。PR の auto-merge gate
# (ci / rustfmt / clippy / cargo test / cargo build --release / coverage /
# bazel-build が全 green でないと merge できない) で main 品質を保つ前提なので、
# main push 後に同じ test を再走させるのは無駄。main push 起点で走るのは
# dev-release.yml だけ。

permissions:
  contents: write
  pull-requests: write

jobs:
  # job key `ci` で local reusable を呼ぶことで、check name が
  # `ci / rustfmt` / `ci / clippy` / `ci / cargo test` / `ci / cargo build --release`
  # の 4 つになる (= `ippoan-rust-default` preset が要求する required check 名と一致)。
  # 各 job の中身は `_lib-ci.yml` を参照。
  ci:
    uses: ./.github/workflows/_lib-ci.yml
    with:
      shared_key: mcp-relay-rs

  # 100% line coverage gate on files registered in coverage_100.toml.
  # Issue #9 Phase 1 で path が `crates/mcp-relay/src/...` に shift したので
  # scripts/coverage_gate.sh も `--workspace` 経由に更新済み。
  coverage:
    name: coverage
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: mcp-relay-rs-coverage

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov

      - name: cargo llvm-cov + 100% gate
        run: bash scripts/coverage_gate.sh

  # Bazel build (issue #9 Phase 1) — rust-alc-api と同じ `ippoan/setup-bazel@main`
  # action で disk-cache + external-cache + repository-cache を有効化。matrix は
  # Phase 2/3 で binary を吸収した時に `//binaries/<name>` を加えて split build に拡張。
  #
  # **ci (cargo 4 job) + coverage を gate に置く**: cargo 側が落ちている状態で
  # Bazel build runner を回しても根本原因 reveal が遅れるだけで runner 時間の無駄
  # なので、両方 success の時のみ起動する。
  bazel-build:
    name: bazel build
    needs: [ci, coverage]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: mcp-relay-lib
            targets: "//crates/mcp-relay:mcp-relay //crates/mcp-relay:mcp-relay_test"
    steps:
      - uses: actions/checkout@v4

      - uses: ippoan/setup-bazel@main
        with:
          disk-cache: "bazel-${{ matrix.name }}"
          external-cache: true
          repository-cache: true

      - name: Build (Bazel)
        run: bazel build -c fastbuild --strip=always ${{ matrix.targets }}

  auto-merge:
    name: Auto Merge
    needs: [ci, coverage, bazel-build]
    if: >-
      always() &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.draft == false &&
      needs.ci.result == 'success' &&
      needs.coverage.result == 'success' &&
      needs.bazel-build.result == 'success'
    uses: ippoan/ci-workflows/.github/workflows/auto-merge.yml@main
    permissions:
      contents: write
      pull-requests: write
    secrets:
      # TAG_RELEASE_PAT を auto-merge にも渡すことで、merge commit が PAT 作者で
      # push される → post-merge workflow (dev-release.yml 等) が GitHub Actions
      # の "GITHUB_TOKEN events don't trigger workflows" 制約を回避して発火する。
      AUTO_MERGE_PAT: ${{ secrets.TAG_RELEASE_PAT }}
