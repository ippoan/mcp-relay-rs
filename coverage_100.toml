# Files the coverage gate enforces 100% line coverage on. Same shape as
# `ippoan/cc-relay` / `rust-alc-api`. After Phase 1 monorepo化 (issue #9),
# paths are relative to the **workspace root** (= `crates/<member>/src/...`)
# so cargo-llvm-cov's `--text` output matches the registered keys.
#
# Files NOT listed are excluded entirely by `--ignore-filename-regex` in
# `scripts/coverage_gate.sh` — they are 1-3 line shims or modules that still
# need real-server mocks to test (`auth.rs` RFC 8628 polling, `relay/mod.rs`
# outbound WS loop).
#
# 拡張方針: 100% を維持しながら段階的に enforced list を広げていく。
# Out of scope (Phase 1 では未 enforce、別 issue で対応):
#   - crates/mcp-relay/src/auth.rs       (device flow polling — needs mock OAuth)
#   - crates/mcp-relay/src/relay/mod.rs  (real outbound WS loop — needs mock WS)
#   - crates/mcp-relay/src/lib.rs        (pure module re-exports, 0 regions)

[[files]]
path = "crates/mcp-relay/src/config.rs"

[[files]]
path = "crates/mcp-relay/src/token_cache.rs"

[[files]]
path = "crates/mcp-relay/src/pair.rs"

[[files]]
path = "crates/mcp-relay/src/relay/frame.rs"

[[files]]
path = "crates/mcp-relay/src/relay/bridge.rs"
